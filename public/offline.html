<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcf8f6" />
    <title>You’re offline · matefor.</title>
    <script>
      try {
        const cookieTheme = document.cookie
          .split("; ")
          .find((item) => item.startsWith("matefor-theme="))
          ?.split("=")[1];
        const savedTheme = localStorage.getItem("matefor-theme") || cookieTheme;
        const theme =
          savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("light", theme !== "dark");
        document.documentElement.style.colorScheme = theme;
      } catch {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #fcf8f6;
        --fg: #20212a;
        --muted: #716b68;
        --line: #e5deda;
        --surface: #fff;
        --primary: #d63d47;
        --primary-text: #20212a;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #17171b;
        --fg: #f6f0ed;
        --muted: #b8aeab;
        --line: #403b3d;
        --surface: #222126;
        --primary: #ed6870;
        --primary-text: #17171b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        margin: 0;
        padding: 28px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.65 Arial,
          sans-serif;
      }
      .wrap {
        width: min(100%, 600px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
      }
      .mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 50%;
        background: #ed6870;
        color: var(--primary-text);
        font-size: 20px;
      }
      .icon {
        display: grid;
        width: 64px;
        height: 64px;
        place-items: center;
        margin-top: 72px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        font-size: 28px;
      }
      .eyebrow {
        margin: 24px 0 4px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(40px, 8vw, 64px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      .description {
        max-width: 470px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 18px;
        margin-top: 26px;
      }
      .button {
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        background: var(--primary);
        color: var(--primary-text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="brand"><span class="mark">m</span> matefor.</div>
      <div class="icon" aria-hidden="true">⌁</div>
      <p class="eyebrow">No connection</p>
      <h1>You’re offline.</h1>
      <p class="description">
        Check your internet connection and try again. Your account and booking information will be
        available when you’re back online.
      </p>
      <div class="actions">
        <button class="button" onclick="location.reload()" type="button">Try again</button>
      </div>
    </main>
  </body>
</html>
